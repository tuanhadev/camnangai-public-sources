<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCP App Demo</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          ui-sans-serif,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: #0f172a;
        background: transparent;
      }
      .card {
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        padding: 20px 22px;
        background: #fff;
        max-width: 640px;
        box-shadow: 0 1px 3px rgb(15 23 42 / 6%);
      }
      .head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 4px;
      }
      h1 {
        font-size: 16px;
        font-weight: 650;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .city {
        font-size: 12px;
        color: #64748b;
        font-variant-numeric: tabular-nums;
      }
      .sub {
        font-size: 12.5px;
        color: #64748b;
        margin: 0 0 18px;
      }
      .row {
        display: grid;
        grid-template-columns: 92px 1fr 62px;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }
      .label {
        font-size: 13px;
        color: #334155;
      }
      .track {
        height: 9px;
        background: #f1f5f9;
        border-radius: 999px;
        overflow: hidden;
      }
      .fill {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #2563eb, #60a5fa);
        transition: width 0.5s ease;
      }
      .val {
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        text-align: right;
        color: #0f172a;
        font-weight: 600;
      }
      .foot {
        display: flex;
        gap: 8px;
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid #f1f5f9;
      }
      button {
        font: inherit;
        font-size: 13px;
        padding: 7px 14px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        background: #fff;
        color: #0f172a;
        cursor: pointer;
      }
      button.primary {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .status {
        margin-left: auto;
        align-self: center;
        font-size: 11.5px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="head">
        <h1 id="title">Weekly deployment metrics</h1>
        <span class="city" id="scope">—</span>
      </div>
      <p class="sub" id="sub">Waiting for data from the MCP server…</p>
      <div id="bars"></div>
      <div class="foot">
        <button class="primary" id="refresh">Refresh data</button>
        <button id="detail">Send to chat</button>
        <span class="status" id="status">idle</span>
      </div>
    </div>
    <script type="module" src="/src/mcp-app.ts"></script>
  </body>
</html>
